<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>通信テスト</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 640px; margin: 0 auto; padding: 16px; font: 16px/1.6 system-ui, sans-serif; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  label { display: block; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; margin: 4px 0 12px; padding: 10px; font-size: 16px; }
  button { display: block; width: 100%; margin: 0 0 8px; padding: 12px; font-size: 16px; text-align: left; cursor: pointer; }
  #log { list-style: none; margin: 16px 0 0; padding: 0; }
  #log li { margin-bottom: 8px; padding: 8px 10px; border-left: 4px solid gray; overflow-wrap: anywhere; }
  #log li.pass { border-color: #1a8a3a; }
  #log li.fail { border-color: #d11a2a; }
  .env { font-size: .8rem; opacity: .7; overflow-wrap: anywhere; }
</style>
</head>
<body>
  <h1>通信テスト（Apps Script）</h1>

  <label for="url">ウェブアプリのURL（…/exec）</label>
  <input id="url" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">

  <button type="button" id="run-all">すべて順番に実行</button>
  <button type="button" data-test="ping">1. 接続確認</button>
  <button type="button" data-test="single">2. 1人を保存</button>
  <button type="button" data-test="group">3. 3人グループを保存（=1+1 / 007 を含む）</button>
  <button type="button" data-test="duplicate">4. 同じ記録を再送（増えないこと）</button>
  <button type="button" data-test="invalid">5. 不正なデータを送信（拒否されること）</button>

  <ul id="log" aria-live="polite"></ul>
  <p class="env" id="env"></p>

<script>
(() => {
  "use strict";

  const URL_KEY = "club-gas-test-url";
  const TIMEOUT_MS = 20000;
  const urlInput = document.querySelector("#url");
  const logEl = document.querySelector("#log");
  let lastGroup = null;

  try { urlInput.value = localStorage.getItem(URL_KEY) || ""; } catch (_) { /* 保存できなくても動かす */ }
  urlInput.addEventListener("change", () => {
    try { localStorage.setItem(URL_KEY, urlInput.value.trim()); } catch (_) { /* 何もしない */ }
  });
  document.querySelector("#env").textContent = `${location.origin} / ${navigator.userAgent}`;

  const pad = (n) => String(n).padStart(2, "0");

  function nowText() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function newGroupID() {
    const d = new Date();
    const random = Math.random().toString(36).slice(2, 5).toUpperCase();
    return `TEST-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}-${random}`;
  }

  function report(title, passed, detail) {
    const li = document.createElement("li");
    li.className = passed ? "pass" : "fail";
    li.textContent = `${passed ? "OK" : "NG"} ${title}：${detail}`;
    logEl.appendChild(li);
    return passed;
  }

  function endpoint() {
    const url = urlInput.value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
      throw new Error("URLは https://script.google.com/…/exec の形で入力してください");
    }
    return url;
  }

  /** ログイン状態に左右されないよう、Cookie なしで通信する */
  async function request(options) {
    const url = endpoint();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(url, {
        redirect: "follow",
        credentials: "omit",
        cache: "no-store",
        signal: ctrl.signal,
        ...options,
      });
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (_) {
        throw new Error(`JSON以外の応答（HTTP ${res.status}）。公開範囲が「全員」か確認してください`);
      }
    } finally {
      clearTimeout(timer);
    }
  }

  const post = (body) => request({
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body),
  });

  const tests = {
    async ping() {
      const r = await request({ method: "GET" });
      return report("接続確認", r.ok === true, JSON.stringify(r));
    },
    async single() {
      const r = await post({
        groupID: newGroupID(),
        timeStamp: nowText(),
        games: ["blackjack"],
        players: [{ name: "テスト一人", age: "成人" }],
      });
      return report("1人を保存", r.ok === true && r.written === 1, JSON.stringify(r));
    },
    async group() {
      lastGroup = {
        groupID: newGroupID(),
        timeStamp: nowText(),
        games: ["blackjack", "poker", "roulette"],
        players: [
          { name: "テスト太郎", age: "高校生" },
          { name: "=1+1", age: "中学生" },
          { name: "007", age: "小学生" },
        ],
      };
      const r = await post(lastGroup);
      return report("3人グループを保存", r.ok === true && r.written === 3, JSON.stringify(r));
    },
    async duplicate() {
      if (!lastGroup) return report("再送", false, "先にテスト3を実行してください");
      const r = await post(lastGroup);
      return report("再送", r.ok === true && r.duplicate === true && r.written === 0, JSON.stringify(r));
    },
    async invalid() {
      const r = await post({
        groupID: newGroupID(),
        timeStamp: nowText(),
        games: ["chess"],
        players: [{ name: "不正", age: "成人" }],
      });
      return report("不正データ", r.ok === false, JSON.stringify(r));
    },
  };

  async function run(name) {
    try {
      return await tests[name]();
    } catch (err) {
      const detail = err.name === "AbortError" ? "時間切れ" : `${err.name}: ${err.message}`;
      return report(name, false, detail);
    }
  }

  const buttons = [...document.querySelectorAll("button")];

  async function exclusive(task) {
    buttons.forEach((b) => (b.disabled = true));
    try {
      await task();
    } finally {
      buttons.forEach((b) => (b.disabled = false));
    }
  }

  document.querySelectorAll("[data-test]").forEach((btn) => {
    btn.addEventListener("click", () => exclusive(() => run(btn.dataset.test)));
  });
  document.querySelector("#run-all").addEventListener("click", () => exclusive(async () => {
    logEl.textContent = "";
    for (const name of Object.keys(tests)) {
      if (!(await run(name)) && name === "ping") return;
    }
  }));
})();
</script>
</body>
</html>
